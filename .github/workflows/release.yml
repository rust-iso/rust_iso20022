name: Release verification

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit or branch to verify without publishing
        required: true
        default: main

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  resolve-revision:
    name: Resolve release revision
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.result }}
    steps:
      - name: Resolve branch, tag, or abbreviated commit to a full SHA
        id: resolve
        uses: actions/github-script@v8
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        with:
          result-encoding: string
          retries: 3
          script: |
            const { data } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: process.env.RELEASE_REVISION,
            });
            if (!/^[0-9a-f]{40}$/.test(data.sha)) {
              throw new Error('Release revision did not resolve to a full commit SHA');
            }
            core.info(`Release commit: ${data.sha}`);
            return data.sha;

  package:
    name: Crate, docs, manifests, and SBOM
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: Full release contract
        run: scripts/release-check.sh --ci-core
      - name: Package without publishing
        run: |
          mkdir -p release-artifacts/crate
          cargo +stable package --locked --allow-dirty -p rust_iso20022
          metadata="$(cargo +stable metadata --locked --no-deps --format-version 1)"
          version="$(jq -r '.packages[] | select(.name == "rust_iso20022") | .version' <<< "$metadata")"
          target_dir="$(jq -r '.target_directory' <<< "$metadata")"
          archive="$target_dir/package/rust_iso20022-$version.crate"
          # Validate immutable release tags independently of their older scripts.
          bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
          if (( bytes >= 10 * 1024 * 1024 )); then
            echo "error: package is $bytes bytes; crates.io limit is 10485760 bytes" >&2
            exit 1
          fi
          echo "package size: $bytes bytes (limit: 10485760)"
          cp -- "$archive" release-artifacts/crate/
          cargo +stable package --list --allow-dirty -p rust_iso20022 > release-artifacts/crate/package-files.txt
      - name: Install pinned SBOM generator
        run: cargo +stable install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate release evidence and SBOM
        run: |
          scripts/generate-release-baseline.sh release-artifacts/manifests
          scripts/generate-sbom.sh release-artifacts/sbom
          (
            cd release-artifacts
            find . -type f ! -path './SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-metadata
          path: release-artifacts
          if-no-files-found: error

  cli:
    name: CLI / ${{ matrix.os }}
    needs: resolve-revision
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-cli-${{ matrix.os }}
      - run: cargo +stable build --locked --release -p rust_iso20022_cli --jobs 1
      - name: Smoke test
        shell: bash
        run: cargo +stable run --locked --release -p rust_iso20022_cli -- detect fixtures/iso/valid/pacs.008.001.08-cross-field.xml
      - uses: actions/upload-artifact@v7
        with:
          name: iso20022-cli-${{ matrix.os }}
          path: |
            target/release/iso20022
            target/release/iso20022.exe
          if-no-files-found: error

  wasm:
    name: WASM package candidate
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm
      - run: cargo +stable build --locked --release -p rust_iso20022_wasm --target wasm32-unknown-unknown --features model-pacs --jobs 1
      - uses: actions/upload-artifact@v7
        with:
          name: rust-iso20022-wasm
          path: target/wasm32-unknown-unknown/release/rust_iso20022_wasm.wasm
          if-no-files-found: error
