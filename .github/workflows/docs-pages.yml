name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "src/**"
      - "docs/**"
      - "examples/**"
      - scripts/build-docs-local.sh
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: target/docs-pages
      DOCS_JOBS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: documentation-pages
      - name: Build representative SDK documentation
        run: scripts/build-docs-local.sh
      - name: Prepare Pages site
        shell: bash
        run: |
          cp docs/pages-index.html "$CARGO_TARGET_DIR/doc/index.html"
          touch "$CARGO_TARGET_DIR/doc/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs-pages/doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
