name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  format:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo +stable fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings

  core:
    name: Core and representative features
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        features:
          - ""
          - "model-head,serde"
          - "model-pacs,serde,convert"
          - "model-pain,serde"
          - "model-camt-053-001-09,serde"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test selected feature contract
        shell: bash
        run: |
          if [[ -n "${{ matrix.features }}" ]]; then
            cargo +stable test --locked -p rust_iso20022 --lib --features "${{ matrix.features }}"
            if [[ "${{ matrix.features }}" == "model-pacs,serde,convert" ]]; then
              cargo +stable test --locked -p rust_iso20022 --test prelude --features "${{ matrix.features }}"
            fi
          else
            cargo +stable test --locked -p rust_iso20022 --no-default-features
          fi

  generated-area:
    name: Generated model / ${{ matrix.area }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        area:
          - acmt
          - admi
          - auth
          - caad
          - caam
          - cafc
          - cafm
          - cafr
          - cain
          - canm
          - casp
          - casr
          - catm
          - catp
          - colr
          - fxtr
          - head
          - pacs
          - pain
          - reda
          - remt
          - secl
          - seev
          - semt
          - sese
          - setr
          - trck
          - tsin
          - tsmt
          - tsrv
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: model-${{ matrix.area }}
      - run: cargo +stable test --locked -p rust_iso20022 --lib --features "model-${{ matrix.area }}"

  model-shard-plan:
    name: Large model coverage plan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate inventory and plan bounded model shards
        id: plan
        shell: bash
        run: |
          matrix="$(python3 scripts/test-model-shards.py --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  generated-large:
    name: Generated model / ${{ matrix.area }} / shard ${{ matrix.shard }}
    needs: model-shard-plan
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.model-shard-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: model-shard-${{ matrix.area }}-${{ matrix.shard }}
          workspaces: ". -> target/model-shards"
      - name: Test every selected message with XML and Serde
        shell: bash
        run: |
          bash scripts/monitor-ci-resources.sh > >(tee "$RUNNER_TEMP/model-resources.log") 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; tail -80 "$RUNNER_TEMP/model-resources.log"' EXIT
          python3 scripts/test-model-shards.py --area "${{ matrix.area }}" --shard "${{ matrix.shard }}"
      - name: Upload runner resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-resources-${{ matrix.area }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/model-resources.log
          retention-days: 7
          if-no-files-found: ignore

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.85 check --locked --workspace --exclude rust_iso20022_mcp --no-default-features
      - name: Check optional core dependencies on MSRV
        run: cargo +1.85 check --locked -p rust_iso20022 --no-default-features --features catalogue,convert,serde

  mcp-msrv:
    name: MCP MSRV 1.88
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-msrv
      - run: cargo +1.88 check --locked -p rust_iso20022_mcp

  wasm:
    name: WASM core compile contract
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Check legacy and structured WASM targets
        run: |
          cargo +stable check --locked --lib --target wasm32-unknown-unknown
          cargo +stable check --locked -p rust_iso20022_wasm --target wasm32-unknown-unknown
          cargo +stable check --locked -p rust_iso20022_wasm --target wasm32-unknown-unknown --features model-pacs

  matrix-contract:
    name: Matrix contract
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Require every generated feature and mandatory baseline row
        shell: bash
        run: |
          for area in acmt admi auth caaa caad caam cafc cafm cafr cain camt canm casp casr catm catp colr fxtr head pacs pain reda remt secl seev semt sese setr trck tsin tsmt tsrv; do
            grep -q "^model-${area} =" Cargo.toml
          done
          test "$(grep -c '^\[\[baseline\]\]' tests/matrix/matrix.toml)" -eq 6
          test "$(grep -c '^mandatory = true' tests/matrix/matrix.toml)" -eq 6
      - name: Verify generated support matrix and feature aliases
        shell: bash
        run: |
          scripts/check-feature-aliases.sh
          scripts/generate-support-matrix.sh /tmp/support-matrix.md
          diff -u docs/support-matrix.md /tmp/support-matrix.md
      - name: Verify CI tooling failure handling
        run: |
          python3 scripts/test-ci-tooling.py
          python3 scripts/test-model-shards-contract.py
