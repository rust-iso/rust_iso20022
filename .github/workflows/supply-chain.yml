name: Supply chain

on:
  schedule:
    - cron: "17 2 * * 1"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - fuzz/rust-toolchain.toml
      - deny.toml
      - .github/workflows/supply-chain.yml
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - fuzz/rust-toolchain.toml
      - deny.toml
      - .github/workflows/supply-chain.yml
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  policy:
    name: Audit, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the tracked lockfile
        run: cargo +stable metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Install pinned supply-chain tools
        id: tools
        run: |
          cargo +stable install cargo-audit --version 0.22.1 --locked
          cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: RustSec audit
        shell: bash
        run: |
          while IFS= read -r lockfile; do
            cargo +stable audit --file "$lockfile"
          done < <(git ls-files '*Cargo.lock')
      - name: Licenses, bans, advisories, and sources
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: cargo +stable deny --locked --all-features check
