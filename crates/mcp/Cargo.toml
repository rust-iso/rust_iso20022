[package]
name = "rust_iso20022_mcp"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Local stdio MCP adapter for rust_iso20022"

[dependencies]
rmcp = { version = "=3.0.0", default-features = false, features = ["server", "macros", "transport-io"] }
rmcp-macros = "=3.0.0"
schemars = "=1.2.2"
rust_iso20022 = { path = "../..", default-features = false, features = ["serde", "model-pacs", "profiles"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

[[bin]]
name = "rust-iso20022-mcp"
path = "src/main.rs"
